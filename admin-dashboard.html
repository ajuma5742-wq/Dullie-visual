<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DULLIE VISUAL | Admin Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: white;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: #111;
      border-right: 1px solid #292929;
      padding: 25px 15px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
      padding: 10px;
      margin-bottom: 35px;
    }

    .sidebar a {
      display: block;
      color: #aaa;
      text-decoration: none;
      padding: 14px 12px;
      margin-bottom: 5px;
      border-radius: 5px;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #222;
      color: white;
    }

    /* MAIN */
    .main {
      margin-left: 240px;
      padding: 35px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .topbar h1 {
      font-size: 30px;
    }

    .view-site {
      color: white;
      text-decoration: none;
      border: 1px solid #444;
      padding: 10px 18px;
      font-size: 13px;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }
